# Airflow (LocalExecutor) orchestrating the datalake jobs as sibling containers.
#
#   docker compose -f docker-compose.spark.yml build            # leads-lake-spark image (bakes jobs/)
#   docker build -f docker/py.Dockerfile -t leads-lake-py:latest .
#   docker compose -f docker-compose.airflow.yml build          # airflow image
#   docker compose -f docker-compose.spark.yml up -d kafka
#   docker compose -f docker-compose.airflow.yml up -d
#   -> UI http://localhost:8080  (admin / admin), then unpause the DAGs
#
# Tasks BashOperator -> `docker run leads-lake-spark|leads-lake-py ...` on the host
# Docker daemon, on the shared `leads-lake-net` network (streaming reaches Kafka).
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  image: leads-lake-airflow:2.10.4
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # keep the scheduler VM from thrashing on many heavy docker-run tasks
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./.env:/opt/airflow/project.env:ro
    - /var/run/docker.sock:/var/run/docker.sock
  depends_on:
    airflow-db:
      condition: service_healthy

services:
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - >
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname a
        --lastname a --role Admin --email admin@example.com || true &&
        airflow pools set heavy 1 "serialise spark containers"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-db:

networks:
  default:
    name: leads-lake-net
    external: true
